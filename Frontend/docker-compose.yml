# UCust · фронт. Композ для подъёма одним запуском.
#
#   docker compose up -d --build
#
# Перенесите адрес шлюза в build args как NEXT_PUBLIC_API_BASE_URL —
# они подставляются в бандл на этапе next build (env контейнера уже не поможет).
services:
  front:
    build:
      context: .
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-https://api.ucust.n4d3sh1k4.site/api/v0}
    image: ucust-front
    container_name: ucust-front
    restart: unless-stopped
    ports:
      - "3000:3000"