server:
  port: 8100
  # КРИТИЧНО: Чтобы Spring понимал, что запрос пришел через прокси (Nginx)
  # и правильно строил Redirect URI для OAuth2
  forward-headers-strategy: native

spring:
  application:
    name: api-gateway

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  codec:
    max-in-memory-size: 10MB

# Секрет должен совпадать со всеми остальными сервисами!
jwt:
  secret:
    access: ${JWT_SECRET_ACCESS:dGhpcy1pcy1hLWxvY2FsLWRldi1zZWNsLyZXQtYmFzZsLTY0LWtleQ==}

cors:
  allowed-origins: https://api.ucust.n4d3sh1k4.site,https://adm.ucust.n4d3sh1k4.site

admin-cookie:
  same-site: None
  secure: true

logging:
  level:
    # На проде лучше поставить INFO, чтобы не забивать диск i3
    org.springframework.cloud.gateway: INFO
    org.springframework.cloud.gateway.route.RouteDefinitionLocator: INFO

services:
  security-service:
    uri: http://security-service:8101
  user-service:
    uri: http://user-service:8102
  business-service:
    uri: http://business-service:8104
  dozzle:
    uri: ${SERVICES_DOZZLE_URI}
  pgadmin:
    uri: ${PGADMIN_URI}

rabbitmq:
  admin:
    uri: ${RABBITMQ_ADMIN_URI}

minio:
  admin:
    uri: ${MINIO_ADMIN_URI}
  s3:
    uri: http://localhost:9020