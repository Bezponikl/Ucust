spring:
  application:
    name: security-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:postgresql://127.0.0.1:5440/security_service_db
    username: ${DB_USER:ETA_DBUser}
    password: ${DB_PASSWORD:ux$kgfmpJysjHBMNhXX!jFnH9@YQp!eW}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  rabbitmq:
    host: localhost
    port: 5680
    username: ${RABBITMQ_USER:service-user}
    password: ${RABBITMQ_PASS:servicepassword}
    virtual-host: universal-host
    template:
      retry:
        enabled: true
        initial-interval: 1000ms
        max-attempts: 3
  security:
    oauth2:
      client:
        registration:
          yandex:
            client-id: ${YANDEX_CLIENT_ID:dbac46e4738740cebc99213c523a8a42}
            client-secret: ${YANDEX_CLIENT_SECRET:2e9012ad0d7c4c718ea8d695dc459f6e}
            client-name: Yandex
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - login:email
              - login:info
        provider:
          yandex:
            authorization-uri: https://oauth.yandex.ru/authorize
            token-uri: https://oauth.yandex.ru/token
            user-info-uri: https://login.yandex.ru/info
            user-name-attribute: id

server:
  port: 8101
  forward-headers-strategy: native

jwt:
  secret:
    access: ${JWT_SECRET_ACCESS:dGhpcy1pcy1hLWxvY2FsLWRldi1zZWNsLyZXQtYmFzZsLTY0LWtleQ==}

cookie:
  secure:
    state: false

logging:
  level:
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    root: INFO
    org.springframework.web: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always

email:
  resend:
    activated:
      time: 1
